<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Pemuka - MyPentaksiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 pb-16 transition-colors duration-200">

  <!-- Bar Navigasi Atas (Sangat Kemas) -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-20 transition-colors">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <!-- Tekan butang P atau tajuk untuk buka Laci Menu Tepi -->
      <button id="btnOpenDrawer" class="flex items-center gap-2.5 focus:outline-none group">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-sm group-active:scale-95 transition">
          P
        </div>
        <div class="text-left">
          <span class="font-bold text-slate-900 dark:text-white text-sm block leading-none">MyPentaksiran</span>
          <span class="text-[10px] text-slate-400">Tekan untuk menu ☰</span>
        </div>
      </button>

      <!-- Pilihan Pantas Tema di Kanan -->
      <button id="btnQuickTheme" class="w-8 h-8 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-xs">
        🌙
      </button>
    </div>
  </header>

  <!-- DRAWER / MENU TEPI (SLIDE-OVER) -->
  <div id="drawerBackdrop" class="hidden fixed inset-0 z-30 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>
  <aside id="sideDrawer" class="fixed top-0 left-0 bottom-0 z-40 w-72 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 p-5 flex flex-col justify-between -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl">
    <div class="space-y-6">
      <!-- Header Drawer -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white font-bold flex items-center justify-center text-xs">
            P
          </div>
          <span class="font-bold text-slate-900 dark:text-white text-sm">Menu Utama</span>
        </div>
        <button id="btnCloseDrawer" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg p-1">✕</button>
      </div>

      <!-- Pautan Menu Navigasi -->
      <nav class="space-y-1.5 text-xs font-semibold">
        <a href="profile.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
          <span class="text-base">👤</span>
          <span id="txtMenuProfile">Profil Guru & Akaun</span>
        </a>
        <a href="dskp.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
          <span class="text-base">📚</span>
          <span id="txtMenuDSKP">Bank DSKP Komuniti</span>
        </a>
      </nav>

      <!-- Tetapan Bahasa & Tema -->
      <div class="pt-4 border-t border-slate-100 dark:border-slate-700 space-y-3">
        <p class="text-[10px] uppercase font-bold text-slate-400">Pilihan Sistem</p>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-600 dark:text-slate-300">Bahasa / Language</span>
          <button id="btnLang" class="text-xs px-3 py-1 font-bold rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-100 dark:bg-slate-700">
            BM
          </button>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-600 dark:text-slate-300">Mod Gelap (Dark Mode)</span>
          <button id="btnThemeToggle" class="text-xs px-3 py-1 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-100 dark:bg-slate-700">
            🌙
          </button>
        </div>
      </div>
    </div>

    <!-- Butang Log Keluar di Bawah Drawer -->
    <div class="pt-4 border-t border-slate-100 dark:border-slate-700">
      <button id="btnLogout" class="w-full flex items-center justify-center gap-2 py-2.5 px-3 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 font-semibold rounded-xl text-xs border border-rose-200 dark:border-rose-900 transition">
        🚪 <span id="txtMenuLogout">Log Keluar</span>
      </button>
    </div>
  </aside>

  <!-- Kandungan Utama Papan Pemuka -->
  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

    <!-- Kad Guru -->
    <div class="bg-indigo-600 dark:bg-indigo-700 rounded-2xl p-5 text-white shadow-sm flex justify-between items-center">
      <div class="flex-1 mr-3">
        <p class="text-xs text-indigo-200" id="txtGreeting">Selamat bertugas,</p>
        <h2 id="userDisplayName" class="text-base font-bold truncate mt-0.5">Memuat...</h2>
        <p id="userSchoolSub" class="text-[11px] text-indigo-200 truncate mt-0.5">Memuat sekolah...</p>
      </div>
      <a href="profile.html" class="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-xl backdrop-blur-sm transition">
        Profil →
      </a>
    </div>

    <!-- Bahagian Urus Kelas -->
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-900 dark:text-white text-sm" id="txtClassTitle">Senarai Kelas Anda</h3>
        <button id="btnOpenModal" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3.5 py-2 rounded-xl shadow-sm transition">
          + Tambah Kelas
        </button>
      </div>

      <!-- Borang Tambah Kelas -->
      <form id="formAddClass" class="hidden bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600 space-y-3">
        <p class="text-xs font-semibold text-slate-700 dark:text-slate-200" id="txtAddClassHead">Daftar Kelas Baharu</p>
        <div>
          <input type="text" id="classNameInput" placeholder="Nama Kelas (cth: 3 Amanah, Class 1A)" required
            class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
          <input type="text" id="classSessionInput" placeholder="Sesi / Tahun (cth: 2026/2027)"
            class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div class="flex gap-2 justify-end">
          <button type="button" id="btnCancelClass" class="text-xs px-3 py-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg">Batal</button>
          <button type="submit" id="btnSaveClass" class="text-xs px-3.5 py-1.5 bg-indigo-600 text-white font-medium rounded-lg">Simpan</button>
        </div>
      </form>

      <!-- Senarai Kad Kelas -->
      <div id="classList" class="space-y-2">
        <p class="text-xs text-slate-400 py-4 text-center">Sedang memuat senarai kelas...</p>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://onojahibqbhxhpyxkqca.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub2phaGlicWJoeGhweXhrcWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDU5NjAsImV4cCI6MjEwNDQyMTk2MH0.UhKRSYCcAizVnKf9dSsIcF1bgOeD8-5KRRSngBvsocI";

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // KAMUS DWI-BAHASA (BM / EN)
    const i18n = {
      ms: {
        txtGreeting: "Selamat bertugas,",
        txtMenuProfile: "Profil Guru & Akaun",
        txtMenuDSKP: "Bank DSKP Komuniti",
        txtMenuLogout: "Log Keluar",
        txtClassTitle: "Senarai Kelas Anda",
        btnAddClass: "+ Tambah Kelas",
        txtAddClassHead: "Daftar Kelas Baharu",
        btnSave: "Simpan",
        btnCancel: "Batal",
        btnOpenClass: "Buka Kelas →",
        noClass: "Belum ada kelas dicipta. Tekan butang '+ Tambah Kelas' di atas.",
        deletePrompt: "Padam kelas ini? Semua rekod murid di dalamnya akan turut dipadam."
      },
      en: {
        txtGreeting: "Welcome back,",
        txtMenuProfile: "Teacher Profile & Account",
        txtMenuDSKP: "DSKP Community Bank",
        txtMenuLogout: "Sign Out",
        txtClassTitle: "Your Class List",
        btnAddClass: "+ Add Class",
        txtAddClassHead: "Register New Class",
        btnSave: "Save",
        btnCancel: "Cancel",
        btnOpenClass: "Open Class →",
        noClass: "No classes created yet. Click '+ Add Class' above.",
        deletePrompt: "Delete this class? All student records inside will also be removed."
      }
    };

    let currentLang = localStorage.getItem("app_lang") || "ms";

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("app_lang", lang);
      document.getElementById("btnLang").textContent = lang === "ms" ? "BM" : "EN";

      const t = i18n[lang];
      document.getElementById("txtGreeting").textContent = t.txtGreeting;
      document.getElementById("txtMenuProfile").textContent = t.txtMenuProfile;
      document.getElementById("txtMenuDSKP").textContent = t.txtMenuDSKP;
      document.getElementById("txtMenuLogout").textContent = t.txtMenuLogout;
      document.getElementById("txtClassTitle").textContent = t.txtClassTitle;
      document.getElementById("btnOpenModal").textContent = t.btnAddClass;
      document.getElementById("txtAddClassHead").textContent = t.txtAddClassHead;
      document.getElementById("btnCancelClass").textContent = t.btnCancel;
      document.getElementById("btnSaveClass").textContent = t.btnSave;
    }

    document.getElementById("btnLang").addEventListener("click", () => {
      applyLanguage(currentLang === "ms" ? "en" : "ms");
      loadClasses();
    });

    // SISTEM TEMA / DARK MODE
    let isDark = localStorage.getItem("app_theme") === "dark";

    function applyTheme(dark) {
      isDark = dark;
      if (dark) {
        document.documentElement.classList.add("dark");
        document.getElementById("btnQuickTheme").textContent = "☀️";
        document.getElementById("btnThemeToggle").textContent = "☀️";
        localStorage.setItem("app_theme", "dark");
      } else {
        document.documentElement.classList.remove("dark");
        document.getElementById("btnQuickTheme").textContent = "🌙";
        document.getElementById("btnThemeToggle").textContent = "🌙";
        localStorage.setItem("app_theme", "light");
      }
    }

    document.getElementById("btnQuickTheme").addEventListener("click", () => applyTheme(!isDark));
    document.getElementById("btnThemeToggle").addEventListener("click", () => applyTheme(!isDark));

    // KAWALAN LACI MENU TEPI (DRAWER)
    const sideDrawer = document.getElementById("sideDrawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const btnOpenDrawer = document.getElementById("btnOpenDrawer");
    const btnCloseDrawer = document.getElementById("btnCloseDrawer");

    function openDrawer() {
      drawerBackdrop.classList.remove("hidden");
      sideDrawer.classList.remove("-translate-x-full");
    }

    function closeDrawer() {
      drawerBackdrop.classList.add("hidden");
      sideDrawer.classList.add("-translate-x-full");
    }

    btnOpenDrawer.addEventListener("click", openDrawer);
    btnCloseDrawer.addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);

    // INISIALISASI
    async function init() {
      applyTheme(isDark);
      applyLanguage(currentLang);

      const { data: { session } } = await client.auth.getSession();
      if (!session) {
        window.location.href = "index.html";
        return;
      }
      currentUser = session.user;

      await loadUserProfile();
      loadClasses();
    }

    async function loadUserProfile() {
      const nameElem = document.getElementById("userDisplayName");
      const schoolElem = document.getElementById("userSchoolSub");

      const { data } = await client
        .from("profiles")
        .select("full_name, school_name")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (data && data.full_name) {
        nameElem.textContent = data.full_name;
        schoolElem.textContent = data.school_name || currentUser.email;
      } else {
        nameElem.textContent = currentUser.email.split("@")[0];
        schoolElem.textContent = currentUser.email;
      }
    }

    // Senarai Kelas
    async function loadClasses() {
      const classList = document.getElementById("classList");
      const t = i18n[currentLang];
      try {
        const { data: classes, error } = await client
          .from("classes")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!classes || classes.length === 0) {
          classList.innerHTML = `
            <div class="text-center py-6 text-slate-400 dark:text-slate-500 text-xs">
              ${t.noClass}
            </div>`;
          return;
        }

        classList.innerHTML = classes.map(c => `
          <div class="flex items-center justify-between p-3.5 rounded-xl border border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/50 hover:bg-indigo-50/50 dark:hover:bg-slate-700 transition">
            <div>
              <p class="font-bold text-slate-800 dark:text-white text-sm">${c.class_name}</p>
              <p class="text-[11px] text-slate-500 dark:text-slate-400">${c.year_session || '2026'}</p>
            </div>
            <div class="flex items-center gap-2">
              <a href="class.html?id=${c.id}" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 shadow-sm inline-block">
                ${t.btnOpenClass}
              </a>
              <button onclick="deleteClass('${c.id}')" class="text-xs text-rose-500 hover:text-rose-700 p-1.5">
                🗑️
              </button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        classList.innerHTML = `<p class="text-xs text-rose-600 text-center py-2">${err.message}</p>`;
      }
    }

    window.deleteClass = async function(id) {
      if (!confirm(i18n[currentLang].deletePrompt)) return;
      try {
        const { error } = await client.from("classes").delete().eq("id", id);
        if (error) throw error;
        loadClasses();
      } catch (err) {
        alert("Gagal memadam: " + err.message);
      }
    };

    const formAddClass = document.getElementById("formAddClass");
    document.getElementById("btnOpenModal").addEventListener("click", () => formAddClass.classList.toggle("hidden"));
    document.getElementById("btnCancelClass").addEventListener("click", () => formAddClass.classList.add("hidden"));

    formAddClass.addEventListener("submit", async (e) => {
      e.preventDefault();
      const className = document.getElementById("classNameInput").value.trim();
      const session = document.getElementById("classSessionInput").value.trim();
      const btnSave = document.getElementById("btnSaveClass");

      btnSave.disabled = true;

      try {
        const { error } = await client.from("classes").insert([
          { user_id: currentUser.id, class_name: className, year_session: session }
        ]);

        if (error) throw error;

        formAddClass.reset();
        formAddClass.classList.add("hidden");
        loadClasses();
      } catch (err) {
        alert("Ralat: " + err.message);
      } finally {
        btnSave.disabled = false;
      }
    });

    document.getElementById("btnLogout").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "index.html";
    });

    init();
  </script>
</body>
</html>
