<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Pemuka - MyPentaksiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 pb-12 transition-colors duration-200">

  <!-- Bar Navigasi Atas -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10 transition-colors">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white font-bold flex items-center justify-center text-sm">
          P
        </div>
        <span class="font-bold text-slate-900 dark:text-white">MyPentaksiran</span>
      </div>

      <!-- Kawalan Cepat: Bahasa, Dark Mode, Navigasi -->
      <div class="flex items-center gap-2">
        <!-- Butang Tukar Bahasa -->
        <button id="btnLang" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-700 font-bold hover:bg-slate-200 dark:hover:bg-slate-600 transition">
          BM
        </button>

        <!-- Butang Dark Mode -->
        <button id="btnTheme" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
          🌙
        </button>

        <a href="dskp.html" id="linkDSKP" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium px-3 py-1.5 rounded-md border border-slate-200 dark:border-slate-700">
          Bank DSKP
        </a>

        <button id="btnLogout" class="text-xs bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 font-medium px-3 py-1.5 rounded-md border border-rose-200 dark:border-rose-900">
          Log Keluar
        </button>
      </div>
    </div>
  </header>

  <!-- Kandungan Utama -->
  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

    <!-- Kad Guru & Profil -->
    <div class="bg-indigo-600 dark:bg-indigo-700 rounded-2xl p-5 text-white shadow-sm flex justify-between items-center">
      <div class="flex-1 mr-3">
        <p class="text-xs text-indigo-200" id="txtGreeting">Selamat bertugas,</p>
        <div class="flex items-center gap-2 mt-0.5">
          <h2 id="userDisplayName" class="text-base font-bold truncate">Memuat...</h2>
          <button id="btnEditName" class="text-[10px] bg-white/20 hover:bg-white/30 text-white px-2 py-0.5 rounded-md backdrop-blur-sm">
            ✏️ Ubah
          </button>
        </div>
        <p id="userEmailSub" class="text-[11px] text-indigo-200 truncate mt-0.5"></p>
      </div>
      <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full backdrop-blur-sm" id="badgeRole">Guru</span>
    </div>

    <!-- Modal Tukar Nama -->
    <div id="modalName" class="hidden bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
      <p class="text-xs font-bold text-slate-800 dark:text-white" id="txtModalTitle">Kemaskini Nama Paparan Guru</p>
      <input type="text" id="inputFullName" placeholder="Cth: Cikgu Sarah, Sir Daniel"
        class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      <div class="flex justify-end gap-2">
        <button type="button" id="btnCancelName" class="text-xs px-3 py-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">Batal</button>
        <button type="button" id="btnSaveName" class="text-xs px-3 py-1.5 bg-indigo-600 text-white font-medium rounded-lg">Simpan Nama</button>
      </div>
    </div>

    <!-- Pengurusan Kelas -->
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-900 dark:text-white text-sm" id="txtClassTitle">Senarai Kelas Anda</h3>
        <button id="btnOpenModal" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-1.5 rounded-lg">
          + Tambah Kelas
        </button>
      </div>

      <!-- Borang Tambah Kelas -->
      <form id="formAddClass" class="hidden bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600 space-y-3">
        <p class="text-xs font-semibold text-slate-700 dark:text-slate-200" id="txtAddClassHead">Daftar Kelas Baharu</p>
        <div>
          <input type="text" id="classNameInput" placeholder="Nama Kelas (cth: 3 Amanah, Class 1A)" required
            class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
          <input type="text" id="classSessionInput" placeholder="Sesi / Tahun (cth: 2026/2027)"
            class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div class="flex gap-2 justify-end">
          <button type="button" id="btnCancelClass" class="text-xs px-3 py-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg">Batal</button>
          <button type="submit" id="btnSaveClass" class="text-xs px-3 py-1.5 bg-indigo-600 text-white font-medium rounded-lg">Simpan</button>
        </div>
      </form>

      <!-- Senarai Kelas -->
      <div id="classList" class="space-y-2">
        <p class="text-xs text-slate-400 py-4 text-center">Sedang memuat senarai kelas...</p>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://onojahibqbhxhpyxkqca.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub2phaGlicWJoeGhweXhrcWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDU5NjAsImV4cCI6MjEwNDQyMTk2MH0.UhKRSYCcAizVnKf9dSsIcF1bgOeD8-5KRRSngBvsocI";

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // KAMUS DWI-BAHASA (BM / EN)
    const i18n = {
      ms: {
        linkDSKP: "Bank DSKP",
        btnLogout: "Log Keluar",
        txtGreeting: "Selamat bertugas,",
        badgeRole: "Guru",
        btnEdit: "✏️ Ubah",
        txtModalTitle: "Kemaskini Nama Paparan Guru",
        btnCancel: "Batal",
        btnSaveName: "Simpan Nama",
        txtClassTitle: "Senarai Kelas Anda",
        btnAddClass: "+ Tambah Kelas",
        txtAddClassHead: "Daftar Kelas Baharu",
        btnSave: "Simpan",
        btnOpenClass: "Buka Kelas →",
        noClass: "Belum ada kelas dicipta. Tekan butang '+ Tambah Kelas' di atas.",
        deletePrompt: "Padam kelas ini? Semua rekod murid di dalamnya akan turut dipadam."
      },
      en: {
        linkDSKP: "DSKP Bank",
        btnLogout: "Sign Out",
        txtGreeting: "Welcome back,",
        badgeRole: "Teacher",
        btnEdit: "✏️ Edit",
        txtModalTitle: "Update Teacher Display Name",
        btnCancel: "Cancel",
        btnSaveName: "Save Name",
        txtClassTitle: "Your Class List",
        btnAddClass: "+ Add Class",
        txtAddClassHead: "Register New Class",
        btnSave: "Save",
        btnOpenClass: "Open Class →",
        noClass: "No classes created yet. Click '+ Add Class' above.",
        deletePrompt: "Delete this class? All student records inside will also be removed."
      }
    };

    let currentLang = localStorage.getItem("app_lang") || "ms";

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("app_lang", lang);
      document.getElementById("btnLang").textContent = lang === "ms" ? "BM" : "EN";

      const t = i18n[lang];
      document.getElementById("linkDSKP").textContent = t.linkDSKP;
      document.getElementById("btnLogout").textContent = t.btnLogout;
      document.getElementById("txtGreeting").textContent = t.txtGreeting;
      document.getElementById("badgeRole").textContent = t.badgeRole;
      document.getElementById("btnEditName").textContent = t.btnEdit;
      document.getElementById("txtModalTitle").textContent = t.txtModalTitle;
      document.getElementById("btnCancelName").textContent = t.btnCancel;
      document.getElementById("btnSaveName").textContent = t.btnSaveName;
      document.getElementById("txtClassTitle").textContent = t.txtClassTitle;
      document.getElementById("btnOpenModal").textContent = t.btnAddClass;
      document.getElementById("txtAddClassHead").textContent = t.txtAddClassHead;
      document.getElementById("btnCancelClass").textContent = t.btnCancel;
      document.getElementById("btnSaveClass").textContent = t.btnSave;
    }

    document.getElementById("btnLang").addEventListener("click", () => {
      applyLanguage(currentLang === "ms" ? "en" : "ms");
      loadClasses();
    });

    // SISTEM DARK MODE
    const btnTheme = document.getElementById("btnTheme");
    let isDark = localStorage.getItem("app_theme") === "dark";

    function applyTheme(dark) {
      isDark = dark;
      if (dark) {
        document.documentElement.classList.add("dark");
        btnTheme.textContent = "☀️";
        localStorage.setItem("app_theme", "dark");
      } else {
        document.documentElement.classList.remove("dark");
        btnTheme.textContent = "🌙";
        localStorage.setItem("app_theme", "light");
      }
    }

    btnTheme.addEventListener("click", () => applyTheme(!isDark));

    // INISIALISASI
    async function init() {
      applyTheme(isDark);
      applyLanguage(currentLang);

      const { data: { session } } = await client.auth.getSession();
      if (!session) {
        window.location.href = "index.html";
        return;
      }
      currentUser = session.user;
      document.getElementById("userEmailSub").textContent = currentUser.email;

      await loadUserProfile();
      loadClasses();
    }

    async function loadUserProfile() {
      const nameElem = document.getElementById("userDisplayName");
      const { data } = await client
        .from("profiles")
        .select("full_name")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (data && data.full_name) {
        nameElem.textContent = data.full_name;
      } else {
        nameElem.textContent = currentUser.email.split("@")[0];
      }
    }

    // Modal Ubah Nama
    const modalName = document.getElementById("modalName");
    const inputFullName = document.getElementById("inputFullName");
    document.getElementById("btnEditName").addEventListener("click", () => {
      inputFullName.value = document.getElementById("userDisplayName").textContent;
      modalName.classList.remove("hidden");
    });
    document.getElementById("btnCancelName").addEventListener("click", () => modalName.classList.add("hidden"));

    document.getElementById("btnSaveName").addEventListener("click", async () => {
      const newName = inputFullName.value.trim();
      if (!newName) return alert("Sila masukkan nama.");

      const btn = document.getElementById("btnSaveName");
      btn.disabled = true;

      try {
        const { error } = await client
          .from("profiles")
          .upsert({ id: currentUser.id, full_name: newName });

        if (error) throw error;

        document.getElementById("userDisplayName").textContent = newName;
        modalName.classList.add("hidden");
      } catch (err) {
        alert("Ralat: " + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // Senarai Kelas
    async function loadClasses() {
      const classList = document.getElementById("classList");
      const t = i18n[currentLang];
      try {
        const { data: classes, error } = await client
          .from("classes")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!classes || classes.length === 0) {
          classList.innerHTML = `
            <div class="text-center py-6 text-slate-400 dark:text-slate-500 text-xs">
              ${t.noClass}
            </div>`;
          return;
        }

        classList.innerHTML = classes.map(c => `
          <div class="flex items-center justify-between p-3 rounded-xl border border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/50 hover:bg-indigo-50/50 dark:hover:bg-slate-700 transition">
            <div>
              <p class="font-bold text-slate-800 dark:text-white text-sm">${c.class_name}</p>
              <p class="text-[11px] text-slate-500 dark:text-slate-400">${c.year_session || '2026'}</p>
            </div>
            <div class="flex items-center gap-2">
              <a href="class.html?id=${c.id}" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 shadow-sm inline-block">
                ${t.btnOpenClass}
              </a>
              <button onclick="deleteClass('${c.id}')" class="text-xs text-rose-500 hover:text-rose-700 p-1.5">
                🗑️
              </button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        classList.innerHTML = `<p class="text-xs text-rose-600 text-center py-2">${err.message}</p>`;
      }
    }

    window.deleteClass = async function(id) {
      if (!confirm(i18n[currentLang].deletePrompt)) return;
      try {
        const { error } = await client.from("classes").delete().eq("id", id);
        if (error) throw error;
        loadClasses();
      } catch (err) {
        alert("Gagal memadam: " + err.message);
      }
    };

    const formAddClass = document.getElementById("formAddClass");
    document.getElementById("btnOpenModal").addEventListener("click", () => formAddClass.classList.toggle("hidden"));
    document.getElementById("btnCancelClass").addEventListener("click", () => formAddClass.classList.add("hidden"));

    formAddClass.addEventListener("submit", async (e) => {
      e.preventDefault();
      const className = document.getElementById("classNameInput").value.trim();
      const session = document.getElementById("classSessionInput").value.trim();
      const btnSave = document.getElementById("btnSaveClass");

      btnSave.disabled = true;

      try {
        const { error } = await client.from("classes").insert([
          { user_id: currentUser.id, class_name: className, year_session: session }
        ]);

        if (error) throw error;

        formAddClass.reset();
        formAddClass.classList.add("hidden");
        loadClasses();
      } catch (err) {
        alert("Ralat: " + err.message);
      } finally {
        btnSave.disabled = false;
      }
    });

    document.getElementById("btnLogout").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "index.html";
    });

    init();
  </script>
</body>
</html>
