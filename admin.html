<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - MyPentaksiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script>
    if (localStorage.getItem("app_theme") === "dark") document.documentElement.classList.add("dark");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 pb-16 transition-colors duration-200">

  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="dashboard.html" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400">← Papan Pemuka</a>
      <span class="text-xs font-bold text-rose-600 dark:text-rose-400 uppercase tracking-widest">Master Admin Panel</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-5">
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h1 class="text-base font-bold text-slate-900 dark:text-white">Pengurusan Pengguna & Langganan</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Urus akses guru ke modul Premium atau percuma.</p>
      </div>
      <input type="text" id="searchUser" placeholder="Cari nama atau emel..." 
        class="text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:ring-1 focus:ring-indigo-500">
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 uppercase text-[10px] font-bold">
            <tr>
              <th class="py-3 px-4">Nama Guru</th>
              <th class="py-3 px-4">Sekolah</th>
              <th class="py-3 px-4 text-center">Pelan Semasa</th>
              <th class="py-3 px-4 text-right">Tindakan</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="divide-y divide-slate-100 dark:divide-slate-700">
            <tr><td colspan="4" class="py-6 text-center text-slate-400">Memuatkan senarai pengguna...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://onojahibqbhxhpyxkqca.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub2phaGlicWJoeGhweXhrcWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDU5NjAsImV4cCI6MjEwNDQyMTk2MH0.UhKRSYCcAizVnKf9dSsIcF1bgOeD8-5KRRSngBvsocI";

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allUsers = [];

    async function init() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) return window.location.href = "index.html";

      const { data: profile } = await client.from("profiles").select("is_admin").eq("id", session.user.id).maybeSingle();
      if (!profile || !profile.is_admin) {
        alert("Akses ditolak. Halaman ini khas untuk Admin sahaja.");
        return window.location.href = "dashboard.html";
      }

      loadUsers();
    }

    async function loadUsers() {
      const tbody = document.getElementById("userTableBody");
      const { data, error } = await client.from("profiles").select("*").order("created_at", { ascending: false });

      if (error || !data) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-rose-500">Ralat: ${error?.message}</td></tr>`;
        return;
      }

      allUsers = data;
      renderTable(data);
    }

    function renderTable(users) {
      const tbody = document.getElementById("userTableBody");
      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">Tiada pengguna ditemui.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => {
        const isPremium = u.plan === 'premium';
        return `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50">
            <td class="py-3 px-4 font-semibold text-slate-900 dark:text-white">
              ${u.full_name || 'Guru Baru'}
              ${u.is_admin ? '<span class="ml-1 text-[9px] bg-rose-100 text-rose-700 px-1 rounded">ADMIN</span>' : ''}
            </td>
            <td class="py-3 px-4 text-slate-500 dark:text-slate-400">${u.school_name || '-'}</td>
            <td class="py-3 px-4 text-center">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${isPremium ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'}">
                ${isPremium ? '⭐ PREMIUM' : 'PERCUMA'}
              </span>
            </td>
            <td class="py-3 px-4 text-right">
              <button onclick="togglePlan('${u.id}', '${u.plan || 'free'}')" class="text-xs px-2.5 py-1 rounded font-medium border ${isPremium ? 'border-rose-200 text-rose-600 hover:bg-rose-50' : 'border-emerald-200 text-emerald-600 hover:bg-emerald-50'}">
                ${isPremium ? 'Tukar Percuma' : 'Naik Taraf Premium'}
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    window.togglePlan = async function(userId, currentPlan) {
      const newPlan = currentPlan === 'premium' ? 'free' : 'premium';
      const { error } = await client.from("profiles").update({ plan: newPlan }).eq("id", userId);
      if (error) return alert("Gagal menukar pelan: " + error.message);
      loadUsers();
    };

    document.getElementById("searchUser").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.full_name && u.full_name.toLowerCase().includes(query)) ||
        (u.school_name && u.school_name.toLowerCase().includes(query))
      );
      renderTable(filtered);
    });

    init();
  </script>
</body>
</html>
