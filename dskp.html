<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank DSKP - MyPentaksiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-16">

  <!-- Navigasi Atas -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="dashboard.html" class="inline-flex items-center text-xs font-semibold text-indigo-600 gap-1">
        ← Papan Pemuka
      </a>
      <span class="text-xs font-bold text-slate-700">Bank DSKP Komuniti</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-5 space-y-5">
    <!-- Header -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-slate-900">Koleksi Sukatan DSKP</h1>
        <p class="text-xs text-slate-500">Gunakan sukatan sedia ada atau daftar baharu</p>
      </div>
      <button id="btnOpenAddSubject" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-1.5 rounded-lg shadow-sm">
        + Tambah DSKP
      </button>
    </div>

    <!-- Borang Daftar Subjek DSKP Baharu -->
    <div id="addSubjectSection" class="hidden bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <h2 class="text-sm font-bold text-slate-800">Daftar Subjek & DSKP Baharu</h2>
      
      <form id="formAddSubject" class="space-y-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nama Mata Pelajaran</label>
          <input type="text" id="subjectName" required placeholder="Contoh: Bahasa Melayu, Matematik"
            class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Tingkatan / Tahun</label>
          <input type="text" id="gradeLevel" required placeholder="Contoh: Tahun 3, Tingkatan 1"
            class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">
            Tampal SK & SP (Format: Kod SP | Huraian)
          </label>
          <p class="text-[10px] text-slate-400 mb-1">Contoh satu baris satu item: <br><code class="text-indigo-600 font-mono">1.1.1 | Mendengar dan menyebut perkataan</code></p>
          <textarea id="spListRaw" rows="6" placeholder="1.1.1 | Mendengar, mengecam sebutan...&#10;1.1.2 | Mendengar, memahami ayat...&#10;2.1.1 | Membaca petikan dengan lancar..."
            class="w-full text-xs p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnCancelSubject" class="text-xs px-3 py-1.5 text-slate-600 hover:bg-slate-200 rounded-lg">Batal</button>
          <button type="submit" id="btnSaveSubject" class="text-xs px-3 py-1.5 bg-indigo-600 text-white font-medium rounded-lg">Simpan ke Bank</button>
        </div>
      </form>
    </div>

    <!-- Senarai Subjek DSKP Sedia Ada -->
    <div class="space-y-3">
      <h3 class="text-xs font-bold text-slate-600 uppercase tracking-wider">Senarai Subjek DSKP Tersedia</h3>
      <div id="dskpList" class="space-y-3">
        <p class="text-xs text-slate-400 py-6 text-center">Sedang memuat senarai DSKP...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://onojahibqbhxhpyxkqca.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub2phaGlicWJoeGhweXhrcWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDU5NjAsImV4cCI6MjEwNDQyMTk2MH0.UhKRSYCcAizVnKf9dSsIcF1bgOeD8-5KRRSngBvsocI";

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function init() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) {
        window.location.href = "index.html";
        return;
      }
      currentUser = session.user;
      loadDskpList();
    }

    async function loadDskpList() {
      const dskpList = document.getElementById("dskpList");
      try {
        const { data: subjects, error } = await client
          .from("dskp_subjects")
          .select("*, dskp_items(count)")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!subjects || subjects.length === 0) {
          dskpList.innerHTML = `
            <div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-slate-400 text-xs">
              Belum ada DSKP didaftarkan. Tekan butang "+ Tambah DSKP" untuk cipta yang pertama.
            </div>`;
          return;
        }

        dskpList.innerHTML = subjects.map(sub => {
          const itemCount = sub.dskp_items ? sub.dskp_items[0]?.count || 0 : 0;
          return `
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-[10px] uppercase font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">
                  ${sub.grade_level}
                </span>
                <h4 class="font-bold text-slate-900 text-sm mt-1">${sub.subject_name}</h4>
                <p class="text-[11px] text-slate-500">${itemCount} Standard Pembelajaran (SP)</p>
              </div>
              <span class="text-[11px] font-medium text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">
                Sedia Digunakan
              </span>
            </div>
          `;
        }).join("");

      } catch (err) {
        dskpList.innerHTML = `<p class="text-xs text-rose-600 text-center py-2">${err.message}</p>`;
      }
    }

    // Toggle Form
    const addSection = document.getElementById("addSubjectSection");
    document.getElementById("btnOpenAddSubject").addEventListener("click", () => addSection.classList.toggle("hidden"));
    document.getElementById("btnCancelSubject").addEventListener("click", () => addSection.classList.add("hidden"));

    // Simpan Subjek + Parse SP
    document.getElementById("formAddSubject").addEventListener("submit", async (e) => {
      e.preventDefault();
      const subject = document.getElementById("subjectName").value.trim();
      const grade = document.getElementById("gradeLevel").value.trim();
      const rawSP = document.getElementById("spListRaw").value.trim();
      const btn = document.getElementById("btnSaveSubject");

      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      try {
        // 1. Simpan tajuk subjek
        const { data: subData, error: subError } = await client
          .from("dskp_subjects")
          .insert([{ subject_name: subject, grade_level: grade, created_by: currentUser.id }])
          .select()
          .single();

        if (subError) throw subError;

        // 2. Parse baris SK/SP jika dimasukkan
        if (rawSP.length > 0) {
          const lines = rawSP.split("\n").map(l => l.trim()).filter(l => l.length > 0);
          const items = lines.map(line => {
            const parts = line.split("|").map(p => p.trim());
            const spCode = parts[0] || "1.1.1";
            const spDesc = parts[1] || parts[0];
            const skCode = spCode.split(".").slice(0, 2).join(".") || "1.1";

            return {
              dskp_id: subData.id,
              sk_code: skCode,
              sk_desc: "Standard Kandungan " + skCode,
              sp_code: spCode,
              sp_desc: spDesc
            };
          });

          const { error: itemError } = await client.from("dskp_items").insert(items);
          if (itemError) throw itemError;
        }

        document.getElementById("formAddSubject").reset();
        addSection.classList.add("hidden");
        loadDskpList();
      } catch (err) {
        alert("Ralat: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Simpan ke Bank";
      }
    });

    init();
  </script>
</body>
</html>z
