<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Guru - MyPentaksiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 pb-16 transition-colors duration-200">

  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10 transition-colors">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="dashboard.html" class="inline-flex items-center text-xs font-semibold text-indigo-600 dark:text-indigo-400 gap-1" id="linkBack">
        ← Papan Pemuka
      </a>
      <span class="text-xs font-bold text-slate-700 dark:text-white" id="txtHeader">Profil Guru</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-6 space-y-5">
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
      <div class="flex items-center gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white font-bold flex items-center justify-center text-lg">P</div>
        <div>
          <h1 id="profHeaderName" class="text-base font-bold text-slate-900 dark:text-white">Memuat...</h1>
          <p id="profHeaderEmail" class="text-xs text-slate-500 dark:text-slate-400">...</p>
        </div>
      </div>

      <form id="formProfileInfo" class="space-y-3 pt-1">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1" id="lblNameLabel">Nama Panggilan / Gelaran Guru</label>
          <input type="text" id="profFullName" required placeholder="Cth: Cikgu Saz, Sir Daniel"
            class="w-full text-xs px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:ring-1 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1" id="lblSchoolLabel">Nama Sekolah / Institusi</label>
          <input type="text" id="profSchool" placeholder="Cth: SK Kolombong, SMK St. Mary"
            class="w-full text-xs px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:ring-1 focus:ring-indigo-500">
        </div>

        <button type="submit" id="btnSaveInfo" class="w-full text-xs py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm">
          Simpan Maklumat Profil
        </button>
      </form>
    </div>

    <!-- Tukar Kata Laluan -->
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-slate-800 dark:text-white uppercase tracking-wider" id="lblPasswordHead">Tukar Kata Laluan</h2>
      
      <form id="formChangePassword" class="space-y-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1" id="lblNewPass">Kata Laluan Baharu (Min. 6 aksara)</label>
          <input type="password" id="newPassword" minlength="6" required placeholder="••••••••"
            class="w-full text-xs px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700">
        </div>

        <button type="submit" id="btnSavePassword" class="w-full text-xs py-2.5 bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white font-semibold rounded-lg shadow-sm">
          Kemas Kini Kata Laluan
        </button>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://onojahibqbhxhpyxkqca.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub2phaGlicWJoeGhweXhrcWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDU5NjAsImV4cCI6MjEwNDQyMTk2MH0.UhKRSYCcAizVnKf9dSsIcF1bgOeD8-5KRRSngBvsocI";

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const currentLang = window.getLang();
    const globalT = window.AppI18n[currentLang];

    const i18n = {
      ms: {
        nameLabel: "Nama Panggilan / Gelaran Guru",
        schoolLabel: "Nama Sekolah / Institusi",
        saveInfo: "Simpan Maklumat Profil",
        passHead: "Tukar Kata Laluan",
        newPass: "Kata Laluan Baharu (Min. 6 aksara)",
        savePass: "Kemas Kini Kata Laluan"
      },
      en: {
        nameLabel: "Teacher Name / Title",
        schoolLabel: "School / Institution Name",
        saveInfo: "Save Profile Info",
        passHead: "Change Password",
        newPass: "New Password (Min. 6 characters)",
        savePass: "Update Password"
      }
    }[currentLang];

    document.getElementById("linkBack").textContent = globalT.backDashboard;
    document.getElementById("txtHeader").textContent = globalT.profileTitle;
    document.getElementById("lblNameLabel").textContent = i18n.nameLabel;
    document.getElementById("lblSchoolLabel").textContent = i18n.schoolLabel;
    document.getElementById("btnSaveInfo").textContent = i18n.saveInfo;
    document.getElementById("lblPasswordHead").textContent = i18n.passHead;
    document.getElementById("lblNewPass").textContent = i18n.newPass;
    document.getElementById("btnSavePassword").textContent = i18n.savePass;

    let currentUser = null;

    async function init() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) return window.location.href = "index.html";
      currentUser = session.user;
      document.getElementById("profHeaderEmail").textContent = currentUser.email;

      const { data } = await client.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
      if (data) {
        document.getElementById("profHeaderName").textContent = data.full_name || "Cikgu";
        document.getElementById("profFullName").value = data.full_name || "";
        document.getElementById("profSchool").value = data.school_name || "";
      } else {
        document.getElementById("profHeaderName").textContent = currentUser.email.split("@")[0];
      }
    }

    document.getElementById("formProfileInfo").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullName = document.getElementById("profFullName").value.trim();
      const school = document.getElementById("profSchool").value.trim();
      const btn = document.getElementById("btnSaveInfo");
      btn.disabled = true;

      try {
        await client.from("profiles").upsert({ id: currentUser.id, full_name: fullName, school_name: school });
        alert(currentLang === 'en' ? "Profile saved!" : "Profil berjaya disimpan!");
        document.getElementById("profHeaderName").textContent = fullName;
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("formChangePassword").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pwd = document.getElementById("newPassword").value;
      const btn = document.getElementById("btnSavePassword");
      btn.disabled = true;

      try {
        await client.auth.updateUser({ password: pwd });
        alert(currentLang === 'en' ? "Password updated!" : "Kata laluan dikemaskini!");
        document.getElementById("formChangePassword").reset();
      } catch (err) {
        alert("Ralat: " + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
