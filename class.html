<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengurusan Kelas - MyPentaksiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script>
    if (localStorage.getItem("app_theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>

  <style>
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #fff !important; color: #000 !important; font-size: 8pt !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .print-table { width: 100% !important; border-collapse: collapse !important; margin-top: 5px; }
      .print-table th, .print-table td { border: 1px solid #94a3b8 !important; padding: 4px 6px !important; text-align: center; }
      .print-table th { background-color: #f1f5f9 !important; font-weight: bold; }
      .print-table td:nth-child(2) { text-align: left !important; }
    }
    @media screen {
      .print-only { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 pb-16 transition-colors duration-200">

  <!-- Navigasi Atas -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10 no-print transition-colors">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="dashboard.html" id="linkBack" class="inline-flex items-center text-xs font-semibold text-indigo-600 dark:text-indigo-400 gap-1">
        ← Dashboard
      </a>
      <span id="navClassName" class="text-xs font-bold text-slate-700 dark:text-slate-200 truncate max-w-[150px]">Memuat...</span>
    </div>
  </header>

  <!-- CETAKAN KHAS PDF TRANSIT KELAS -->
  <div class="print-only p-4">
    <div class="text-center border-b-2 border-slate-800 pb-2 mb-3">
      <h2 class="text-sm font-extrabold uppercase">REKOD KESELURUHAN PENCAPAIAN KELAS</h2>
      <p id="printClassTitle" class="text-[9pt] font-bold text-slate-700">KELAS</p>
    </div>
    <div class="mb-2 text-[8pt] flex justify-between">
      <p><strong>Tarikh Cetak:</strong> <span id="printDate">-</span></p>
    </div>
    <table class="print-table">
      <thead>
        <tr>
          <th>No</th>
          <th style="width:200px;">Nama Murid</th>
          <th>Jantina</th>
          <th>Jumlah Rekod PBD</th>
        </tr>
      </thead>
      <tbody id="printTableBody"></tbody>
    </table>
  </div>

  <main class="max-w-4xl mx-auto px-4 pt-5 space-y-4 no-print">
    <!-- Kad Kelas & Butang Modul -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <h1 id="displayClassName" class="text-lg font-bold text-slate-900 dark:text-white">Memuat...</h1>
          <span id="studentCountBadge" class="text-[11px] bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 font-semibold px-2 py-0.5 rounded-full">
            0 Students
          </span>
        </div>
        <p id="displayClassSession" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">...</p>
      </div>

      <div class="flex gap-2">
        <a id="btnStartPBD" href="#" class="flex-1 sm:flex-none inline-flex items-center justify-center text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3.5 py-2.5 rounded-xl shadow-sm transition">
          📝 PBD
        </a>
        <a id="btnActivity" href="#" class="flex-1 sm:flex-none inline-flex items-center justify-center text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3.5 py-2.5 rounded-xl shadow-sm transition">
          ⭐ Behavior & Homework
        </a>
      </div>
    </div>

    <!-- Senarai Murid -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <h2 id="txtStudentListHead" class="text-sm font-bold text-slate-800 dark:text-white">Student List</h2>
        <button id="btnToggleAdd" type="button" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-1.5 rounded-lg">
          + Add Student
        </button>
      </div>

      <!-- Borang Tambah Murid -->
      <div id="addStudentSection" class="hidden bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600 space-y-3">
        <div class="flex gap-2 border-b border-slate-200 dark:border-slate-600 pb-2 text-xs">
          <button id="tabSingle" type="button" class="font-bold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 pb-1">Single Student</button>
          <button id="tabBulk" type="button" class="text-slate-500 dark:text-slate-400 pb-1 hover:text-slate-800 dark:hover:text-white">Bulk Paste</button>
        </div>

        <form id="formSingleStudent" class="space-y-3">
          <div>
            <label id="lblStudentName" class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">Student Full Name</label>
            <input type="text" id="studentName" required placeholder="Contoh: Muhammad Ali bin Ahmad"
              class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500">
          </div>
          <div>
            <label id="lblGender" class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">Gender</label>
            <select id="studentGender" class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
              <option value="L">Male (L)</option>
              <option value="P">Female (P)</option>
            </select>
          </div>
          <div class="flex justify-end gap-2 pt-1">
            <button type="button" class="btnCancelAdd text-xs px-3 py-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg">Cancel</button>
            <button type="submit" id="btnSaveSingle" class="text-xs px-3.5 py-1.5 bg-indigo-600 text-white font-medium rounded-lg">Save Student</button>
          </div>
        </form>

        <form id="formBulkStudent" class="hidden space-y-3">
          <div>
            <label id="lblBulkDesc" class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">
              Paste Name List (Boleh sertakan jantina: Nama | L atau Nama | P):
            </label>
            <textarea id="bulkNames" rows="5" placeholder="Ahmad Daniel | L&#10;Nur Syuhada | P&#10;Chong Wei Loon, L&#10;Siti Sarah, P"
              class="w-full text-xs p-3 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono"></textarea>
            <p class="text-[10px] text-slate-400 mt-1">*Jika tiada jantina diletakkan, sistem akan setkan 'L' secara automatik.</p>
          </div>
          <div class="flex justify-end gap-2 pt-1">
            <button type="button" class="btnCancelAdd text-xs px-3 py-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg">Cancel</button>
            <button type="submit" id="btnSaveBulk" class="text-xs px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm">Process & Save</button>
          </div>
        </form>
      </div>

      <!-- Senarai Murid -->
      <div id="studentsList" class="divide-y divide-slate-100 dark:divide-slate-700">
        <p class="text-xs text-slate-400 py-4 text-center">Loading...</p>
      </div>

      <!-- BUTANG CSV & PDF KELAS -->
      <div class="pt-4 border-t border-slate-100 dark:border-slate-700 flex flex-col sm:flex-row gap-2 justify-end">
        <button id="btnExportCSV" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3.5 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-1.5">
          📥 Eksport Excel (CSV)
        </button>
        <button id="btnExportPDFClass" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3.5 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-1.5">
          ⭐ 🖨️ Muat Turun Ringkasan Kelas (PDF)
        </button>
      </div>
    </div>
  </main>

  <!-- MODAL EDIT NAMA & JANTINA -->
  <div id="modalEditStudent" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-2">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white" id="txtEditModalHead">Edit Student</h3>
        <button type="button" onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white font-bold">✕</button>
      </div>

      <input type="hidden" id="editStudentId">

      <div class="space-y-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1" id="lblEditName">Full Name</label>
          <input type="text" id="editStudentName" required class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1" id="lblEditGender">Gender</label>
          <select id="editStudentGender" class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 bg-white">
            <option value="L">Male (L)</option>
            <option value="P">Female (P)</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-700">
        <button type="button" onclick="closeEditModal()" class="text-xs px-3 py-1.5 text-slate-600 dark:text-slate-300" id="btnCancelEdit">Cancel</button>
        <button type="button" id="btnSaveEditStudent" class="text-xs px-4 py-1.5 bg-indigo-600 text-white font-medium rounded-lg">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://onojahibqbhxhpyxkqca.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub2phaGlicWJoeGhweXhrcWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDU5NjAsImV4cCI6MjEwNDQyMTk2MH0.UhKRSYCcAizVnKf9dSsIcF1bgOeD8-5KRRSngBvsocI";

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const classId = urlParams.get("id") || urlParams.get("class_id");

    let currentUser = null;
    let currentClass = null;
    let students = [];
    const currentLang = localStorage.getItem("app_lang") || "ms";

    if (!classId) window.location.href = "dashboard.html";

    document.getElementById("btnStartPBD").href = `transit.html?class_id=${classId}`;
    document.getElementById("btnActivity").href = `activity.html?class_id=${classId}`;

    function formatDate(dateString) {
      if (!dateString) return "";
      const d = new Date(dateString);
      return d.toLocaleDateString("ms-MY", { day: "2-digit", month: "short", year: "numeric" });
    }

    const i18n = {
      ms: {
        linkBack: "← Dashboard",
        btnActivity: "⭐ Sahsiah & Tugasan",
        txtStudentListHead: "Senarai Murid",
        btnAddStudent: "+ Tambah Murid",
        tabSingle: "Satu Murid",
        tabBulk: "Tampal Banyak (Bulk)",
        lblStudentName: "Nama Penuh Murid",
        lblGender: "Jantina",
        lblBulkDesc: "Tampal Senarai Nama (Boleh sertakan jantina: Nama | L atau Nama | P):",
        btnCancel: "Batal",
        btnSaveSingle: "Simpan Murid",
        btnSaveBulk: "Proses & Simpan",
        btnReport: "Laporan",
        btnDelete: "Padam",
        studentsSuffix: "Murid",
        noStudents: "Tiada murid lagi. Masukkan nama murid untuk mula mentaksir.",
        confirmDelete: "Adakah anda pasti mahu memadam rekod murid ini?",
        editHead: "Kemaskini Maklumat Murid",
        saveChanges: "Simpan Perubahan"
      },
      en: {
        linkBack: "← Dashboard",
        btnActivity: "⭐ Behavior & Homework",
        txtStudentListHead: "Student List",
        btnAddStudent: "+ Add Student",
        tabSingle: "Single Student",
        tabBulk: "Bulk Paste",
        lblStudentName: "Student Full Name",
        lblGender: "Gender",
        lblBulkDesc: "Paste Name List (Can include gender: Name | L or Name | P):",
        btnCancel: "Cancel",
        btnSaveSingle: "Save Student",
        btnSaveBulk: "Process & Save",
        btnReport: "Report",
        btnDelete: "Delete",
        studentsSuffix: "Students",
        noStudents: "No students registered yet. Add students to begin assessment.",
        confirmDelete: "Are you sure you want to delete this student record?",
        editHead: "Edit Student Details",
        saveChanges: "Save Changes"
      }
    };

    function applyLanguage() {
      const t = i18n[currentLang];
      document.getElementById("linkBack").textContent = t.linkBack;
      document.getElementById("btnActivity").textContent = t.btnActivity;
      document.getElementById("txtStudentListHead").textContent = t.txtStudentListHead;
      document.getElementById("btnToggleAdd").textContent = t.btnAddStudent;
      document.getElementById("tabSingle").textContent = t.tabSingle;
      document.getElementById("tabBulk").textContent = t.tabBulk;
      document.getElementById("lblStudentName").textContent = t.lblStudentName;
      document.getElementById("lblGender").textContent = t.lblGender;
      document.getElementById("lblBulkDesc").textContent = t.lblBulkDesc;
      document.getElementById("btnSaveSingle").textContent = t.btnSaveSingle;
      document.getElementById("btnSaveBulk").textContent = t.btnSaveBulk;
      document.getElementById("txtEditModalHead").textContent = t.editHead;
      document.getElementById("lblEditName").textContent = t.lblStudentName;
      document.getElementById("lblEditGender").textContent = t.lblGender;
      document.getElementById("btnCancelEdit").textContent = t.btnCancel;
      document.getElementById("btnSaveEditStudent").textContent = t.saveChanges;
      document.querySelectorAll(".btnCancelAdd").forEach(b => b.textContent = t.btnCancel);
    }

    async function init() {
      applyLanguage();
      const { data: { session } } = await client.auth.getSession();
      if (!session) return window.location.href = "index.html";
      currentUser = session.user;

      await fetchClassDetails();
      await fetchStudents();
    }

    async function fetchClassDetails() {
      const { data, error } = await client.from("classes").select("*").eq("id", classId).maybeSingle();
      if (error || !data) return;
      currentClass = data;
      document.getElementById("navClassName").textContent = data.class_name;
      document.getElementById("displayClassName").textContent = data.class_name;
      document.getElementById("displayClassSession").textContent = data.year_session || "2026";
      document.getElementById("printClassTitle").textContent = `${data.class_name} (${data.year_session || '2026'})`;
    }

    async function fetchStudents() {
      const studentsList = document.getElementById("studentsList");
      const t = i18n[currentLang];
      try {
        const { data, error } = await client
          .from("students")
          .select("*")
          .eq("class_id", classId)
          .order("full_name", { ascending: true });

        if (error) throw error;
        students = data || [];

        document.getElementById("studentCountBadge").textContent = `${students.length} ${t.studentsSuffix}`;

        if (students.length === 0) {
          studentsList.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">${t.noStudents}</div>`;
          return;
        }

        studentsList.innerHTML = students.map((s, idx) => `
          <div class="py-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-semibold text-slate-400 w-5">${idx + 1}.</span>
              <div>
                <p class="text-xs font-semibold text-slate-800 dark:text-white">${s.full_name}</p>
                <span class="text-[10px] text-slate-400 uppercase">${s.gender === 'P' ? 'PEREMPUAN' : 'LELAKI'}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button" onclick="openEditModal('${s.id}', '${s.full_name.replace(/'/g, "\\'")}', '${s.gender || 'L'}')"
                class="text-[11px] bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-semibold px-2 py-1 rounded-md border border-slate-200 dark:border-slate-600">
                ✏️
              </button>
              <a href="report.html?student_id=${s.id}&class_id=${classId}" 
                class="text-[11px] bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 text-indigo-600 dark:text-indigo-400 font-semibold px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-600">
                ${t.btnReport}
              </a>
              <button type="button" onclick="deleteStudent('${s.id}')" class="text-[11px] text-rose-500 hover:text-rose-700 p-1">
                ${t.btnDelete}
              </button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        studentsList.innerHTML = `<p class="text-xs text-rose-600 text-center py-2">${err.message}</p>`;
      }
    }

    window.openEditModal = function(id, name, gender) {
      document.getElementById("editStudentId").value = id;
      document.getElementById("editStudentName").value = name;
      document.getElementById("editStudentGender").value = gender;
      document.getElementById("modalEditStudent").classList.remove("hidden");
    };

    window.closeEditModal = function() {
      document.getElementById("modalEditStudent").classList.add("hidden");
    };

    document.getElementById("btnSaveEditStudent").addEventListener("click", async () => {
      const id = document.getElementById("editStudentId").value;
      const newName = document.getElementById("editStudentName").value.trim();
      const newGender = document.getElementById("editStudentGender").value;
      if (!newName) return alert("Sila masukkan nama murid.");

      try {
        await client.from("students").update({ full_name: newName, gender: newGender }).eq("id", id);
        closeEditModal();
        fetchStudents();
      } catch (err) {
        alert("Ralat: " + err.message);
      }
    });

    const addSection = document.getElementById("addStudentSection");
    document.getElementById("btnToggleAdd").addEventListener("click", () => addSection.classList.toggle("hidden"));
    document.querySelectorAll(".btnCancelAdd").forEach(btn => btn.addEventListener("click", () => addSection.classList.add("hidden")));

    document.getElementById("tabSingle").addEventListener("click", () => {
      document.getElementById("tabSingle").className = "font-bold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 pb-1";
      document.getElementById("tabBulk").className = "text-slate-500 dark:text-slate-400 pb-1 hover:text-slate-800 dark:hover:text-white";
      document.getElementById("formSingleStudent").classList.remove("hidden");
      document.getElementById("formBulkStudent").classList.add("hidden");
    });

    document.getElementById("tabBulk").addEventListener("click", () => {
      document.getElementById("tabBulk").className = "font-bold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 pb-1";
      document.getElementById("tabSingle").className = "text-slate-500 dark:text-slate-400 pb-1 hover:text-slate-800 dark:hover:text-white";
      document.getElementById("formBulkStudent").classList.remove("hidden");
      document.getElementById("formSingleStudent").classList.add("hidden");
    });

    document.getElementById("formSingleStudent").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("studentName").value.trim();
      const gender = document.getElementById("studentGender").value;
      try {
        await client.from("students").insert([{ class_id: classId, user_id: currentUser.id, full_name: name, gender: gender }]);
        document.getElementById("formSingleStudent").reset();
        addSection.classList.add("hidden");
        fetchStudents();
      } catch (err) {
        alert("Ralat: " + err.message);
      }
    });

    document.getElementById("formBulkStudent").addEventListener("submit", async (e) => {
      e.preventDefault();
      const rawText = document.getElementById("bulkNames").value;
      const lines = rawText.split("\n").map(n => n.trim()).filter(n => n.length > 0);
      if (lines.length === 0) return alert("Sila masukkan senarai nama.");

      const records = lines.map(line => {
        let name = line;
        let gender = "L";
        let delimiter = line.includes("|") ? "|" : (line.includes(",") ? "," : (line.includes("\t") ? "\t" : null));
        if (delimiter) {
          const parts = line.split(delimiter).map(p => p.trim());
          name = parts[0];
          if ((parts[1] || "").toUpperCase().startsWith("P")) gender = "P";
        }
        return { class_id: classId, user_id: currentUser.id, full_name: name, gender: gender };
      });

      try {
        await client.from("students").insert(records);
        document.getElementById("formBulkStudent").reset();
        addSection.classList.add("hidden");
        fetchStudents();
      } catch (err) {
        alert("Ralat: " + err.message);
      }
    });

    window.deleteStudent = async function(id) {
      if (!confirm(i18n[currentLang].confirmDelete)) return;
      await client.from("students").delete().eq("id", id);
      fetchStudents();
    };

    // EKSPORT CSV SENARAI KELAS
    document.getElementById("btnExportCSV").addEventListener("click", () => {
      if (students.length === 0) return alert("Tiada murid dalam kelas.");
      const rows = [["No", "Nama Murid", "Jantina"]];
      students.forEach((s, idx) => {
        rows.push([idx + 1, `"${s.full_name}"`, s.gender || "L"]);
      });
      const csvContent = "\uFEFF" + rows.map(r => r.join(",")).join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Senarai_Murid_${currentClass?.class_name || 'Kelas'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // KUNCI PREMIUM: MUAT TURUN PDF RINGKASAN KELAS
    document.getElementById("btnExportPDFClass").addEventListener("click", async () => {
      const { data: { session } } = await client.auth.getSession();
      if (!session) return;

      const { data: profile } = await client.from("profiles").select("plan, is_admin").eq("id", session.user.id).maybeSingle();
      const isPremium = profile && (profile.plan === 'premium' || profile.is_admin === true);

      if (!isPremium) {
        alert("⭐ Muat turun ringkasan kelas PDF adalah ciri Premium.\n\nSila hubungi pentadbir untuk menaik taraf akaun anda.");
        return;
      }

      if (students.length === 0) return alert("Tiada murid dalam kelas.");

      try {
        const studentIds = students.map(s => s.id);
        const { data: allRecords } = await client.from("pbd_records").select("student_id, tp_score").in("student_id", studentIds);

        const countMap = {};
        (allRecords || []).forEach(r => {
          countMap[r.student_id] = (countMap[r.student_id] || 0) + 1;
        });

        document.getElementById("printDate").textContent = formatDate(new Date());
        const tbody = document.getElementById("printTableBody");
        tbody.innerHTML = students.map((s, idx) => `
          <tr>
            <td style="text-align:center;">${idx + 1}</td>
            <td><strong>${s.full_name}</strong></td>
            <td style="text-align:center;">${s.gender === 'P' ? 'Perempuan' : 'Lelaki'}</td>
            <td style="text-align:center; font-weight:bold;">${countMap[s.id] || 0} Rekod SP</td>
          </tr>
        `).join("");

        window.print();
      } catch (err) {
        alert("Gagal menjana PDF: " + err.message);
      }
    });

    init();
  </script>
</body>
</html>
