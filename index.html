<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk - Sistem Pentaksiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 text-slate-800">

  <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-sm border border-slate-100">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-2 font-bold text-xl">
        P
      </div>
      <h1 class="text-xl font-bold text-slate-900" id="headerTitle">Selamat Datang</h1>
      <p class="text-xs text-slate-500 mt-1" id="headerSubtitle">Sistem Pengurusan PBD & Sahsiah Murid</p>
    </div>

    <!-- Kotak Notifikasi / Mesej Ralat -->
    <div id="authAlert" class="hidden mb-4 p-3 rounded-lg text-xs leading-relaxed"></div>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">E-mel</label>
        <input type="email" id="email" required placeholder="nama@sekolah.edu.my" 
          class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <div id="passwordField">
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Kata Laluan</label>
          <button type="button" id="btnForgotPassword" class="text-[11px] text-indigo-600 hover:underline">
            Lupa kata laluan?
          </button>
        </div>
        <input type="password" id="password" placeholder="••••••••" minlength="6"
          class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <button type="submit" id="btnAuth" 
        class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm shadow transition duration-150">
        Log Masuk
      </button>
    </form>

    <div class="mt-5 text-center text-xs text-slate-500 space-y-2">
      <div id="toggleContainer">
        <span id="toggleText">Belum ada akaun?</span>
        <button type="button" id="toggleAuthMode" class="text-indigo-600 font-semibold hover:underline ml-1">Daftar Akaun</button>
      </div>
      <div id="backToLoginContainer" class="hidden">
        <button type="button" id="btnBackToLogin" class="text-indigo-600 font-semibold hover:underline">
          ← Kembali ke Log Masuk
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://onojahibqbhxhpyxkqca.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub2phaGlicWJoeGhweXhrcWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDU5NjAsImV4cCI6MjEwNDQyMTk2MH0.UhKRSYCcAizVnKf9dSsIcF1bgOeD8-5KRRSngBvsocI";

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authForm = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const passwordField = document.getElementById("passwordField");
    const btnAuth = document.getElementById("btnAuth");
    const toggleAuthMode = document.getElementById("toggleAuthMode");
    const toggleText = document.getElementById("toggleText");
    const authAlert = document.getElementById("authAlert");
    const headerTitle = document.getElementById("headerTitle");
    const headerSubtitle = document.getElementById("headerSubtitle");
    const btnForgotPassword = document.getElementById("btnForgotPassword");
    const backToLoginContainer = document.getElementById("backToLoginContainer");
    const toggleContainer = document.getElementById("toggleContainer");
    const btnBackToLogin = document.getElementById("btnBackToLogin");

    // Mod: 'login', 'signup', 'reset'
    let currentMode = "login";

    function showAlert(message, isError = true) {
      authAlert.className = "mb-4 p-3 rounded-lg text-xs leading-relaxed block";
      if (isError) {
        authAlert.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
      } else {
        authAlert.classList.add("bg-emerald-50", "text-emerald-700", "border", "border-emerald-200");
      }
      authAlert.innerHTML = message;
    }

    function setMode(mode) {
      currentMode = mode;
      authAlert.classList.add("hidden");

      if (mode === "login") {
        headerTitle.textContent = "Selamat Datang";
        headerSubtitle.textContent = "Sistem Pengurusan PBD & Sahsiah Murid";
        passwordField.classList.remove("hidden");
        passwordInput.required = true;
        btnAuth.textContent = "Log Masuk";
        toggleContainer.classList.remove("hidden");
        toggleText.textContent = "Belum ada akaun?";
        toggleAuthMode.textContent = "Daftar Akaun";
        backToLoginContainer.classList.add("hidden");
      } else if (mode === "signup") {
        headerTitle.textContent = "Daftar Guru";
        headerSubtitle.textContent = "Cipta akaun untuk mentaksir murid anda";
        passwordField.classList.remove("hidden");
        passwordInput.required = true;
        btnAuth.textContent = "Daftar Akaun Baharu";
        toggleContainer.classList.remove("hidden");
        toggleText.textContent = "Sudah mempunyai akaun?";
        toggleAuthMode.textContent = "Log Masuk Sini";
        backToLoginContainer.classList.add("hidden");
      } else if (mode === "reset") {
        headerTitle.textContent = "Set Semula Kata Laluan";
        headerSubtitle.textContent = "Masukkan e-mel anda untuk pautan pemulihan";
        passwordField.classList.add("hidden");
        passwordInput.required = false;
        btnAuth.textContent = "Hantar Pautan Reset";
        toggleContainer.classList.add("hidden");
        backToLoginContainer.classList.remove("hidden");
      }
    }

    toggleAuthMode.addEventListener("click", () => {
      setMode(currentMode === "login" ? "signup" : "login");
    });

    btnForgotPassword.addEventListener("click", () => {
      setMode("reset");
    });

    btnBackToLogin.addEventListener("click", () => {
      setMode("login");
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      btnAuth.disabled = true;
      btnAuth.textContent = "Memproses...";
      authAlert.classList.add("hidden");

      try {
        if (currentMode === "signup") {
          const { error } = await client.auth.signUp({ email, password });
          if (error) throw error;
          showAlert("<strong>Pendaftaran Berjaya!</strong> Sila log masuk dengan akaun anda.", false);
          setMode("login");
        } else if (currentMode === "login") {
          const { error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showAlert("Log masuk berjaya! Sedang memuat...", false);
          setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
        } else if (currentMode === "reset") {
          const { error } = await client.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + "/index.html"
          });
          if (error) throw error;
          showAlert("Pautan tetapan semula kata laluan telah dihantar ke e-mel anda. Sila semak peti masuk (atau folder spam).", false);
        }
      } catch (err) {
        showAlert("<strong>Ralat:</strong> " + (err.message || "Gagal berhubung dengan pelayan."));
      } finally {
        btnAuth.disabled = false;
        if (currentMode === "login") btnAuth.textContent = "Log Masuk";
        else if (currentMode === "signup") btnAuth.textContent = "Daftar Akaun Baharu";
        else if (currentMode === "reset") btnAuth.textContent = "Hantar Pautan Reset";
      }
    });

    // Semak jika pengguna datang dari pautan reset password di emel
    async function checkRecovery() {
      const hash = window.location.hash;
      if (hash && hash.includes("type=recovery")) {
        showAlert("Sila masukkan kata laluan baharu anda di profil setelah log masuk.", false);
      }
    }
    checkRecovery();
  </script>
</body>
</html>
