<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk - Sistem Pentaksiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 text-slate-800">

  <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-sm border border-slate-100">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-2 font-bold text-xl">
        P
      </div>
      <h1 class="text-xl font-bold text-slate-900">Selamat Datang</h1>
      <p class="text-xs text-slate-500 mt-1">Sistem Pengurusan PBD & Sahsiah Murid</p>
    </div>

    <div id="authAlert" class="hidden mb-4 p-3 rounded-lg text-xs"></div>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">E-mel</label>
        <input type="email" id="email" required placeholder="nama@sekolah.edu.my" 
          class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Kata Laluan</label>
        <input type="password" id="password" required placeholder="••••••••" 
          class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <button type="submit" id="btnAuth" 
        class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm shadow transition duration-150">
        Log Masuk
      </button>
    </form>

    <div class="mt-5 text-center text-xs text-slate-500">
      <span id="toggleText">Belum ada akaun?</span>
      <button id="toggleAuthMode" class="text-indigo-600 font-semibold hover:underline ml-1">Daftar Akaun</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
